# Only read-only chain data and signed join descriptors cross the public boundary.
limit_req_zone $binary_remote_addr zone=tm_read:10m rate=10r/s;
server {
  listen 26657;
  server_tokens off;
  client_max_body_size 1k;
  client_header_timeout 10s;
  send_timeout 15s;
  limit_req zone=tm_read burst=20 nodelay;
  add_header X-Content-Type-Options nosniff always;
  location = /api/invitation {
    limit_except GET { deny all; }
    alias /public/invitation.json;
    default_type application/json;
    add_header Cache-Control "no-store";
  }
  location = /api/invitation.sha256 {
    limit_except GET { deny all; }
    alias /public/invitation.sha256;
    default_type text/plain;
    add_header Cache-Control "no-store";
  }
  location ~ ^/(status|health|genesis|block|commit|validators|abci_info)$ {
    limit_except GET { deny all; }
    proxy_pass http://node:26657;
    proxy_read_timeout 15s;
    proxy_buffering on;
  }
  location ~ "^/checkpoints/(latest|[a-f0-9]{24})\.json$" {
    limit_except GET { deny all; }
    root /public;
    default_type application/json;
    add_header Cache-Control "public, max-age=60";
    try_files $uri =404;
  }
  location ~ "^/checkpoints/[a-f0-9]{24}/(manifest\.json|genesis\.json|app-state\.json|mpt\.tar\.gz|tendermint\.tar\.gz)$" {
    limit_except GET { deny all; }
    root /public;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / { return 404; }
}
