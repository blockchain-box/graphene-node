# nginx config for single-page app (Vite build output)
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep browser API and WebSocket traffic on the explorer's origin, including HTTPS deployments.
  location /graphene-evm/ {
    proxy_pass http://app-evm-sentry:3003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  # Serve static files, fallback to index.html for SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: increase file size limits if needed
  client_max_body_size 10M;

  # Standard logs
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
}

